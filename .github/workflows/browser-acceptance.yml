name: Browser acceptance (QA branch only)

on:
  push:
    branches: [qa/browser-acceptance-20261018]

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/qa/browser-acceptance-20261018'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version
      - name: Install locked site dependencies
        run: pnpm install --frozen-lockfile
      - name: Run existing site checks and production build
        run: pnpm check
      - name: Install isolated locked browser tests
        run: pnpm --dir qa/browser install --frozen-lockfile
      - name: Install matching official Chromium
        run: pnpm --dir qa/browser exec playwright install chromium
      - name: Check QA TypeScript
        id: qa_types
        run: pnpm exec tsc --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --typeRoots qa/browser/node_modules/@types --types node qa/browser/playwright.config.ts qa/browser/tests/blog.spec.ts
      - name: Prepare detached baseline on the same VM
        run: |
          git diff --exit-code e955fa878a946c8dee446036f3115767b07b0117 HEAD -- src public index.html package.json pnpm-lock.yaml build vite.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qaBaselineDir = Join-Path $env:RUNNER_TEMP 'blog-baseline'
          git worktree add --detach "$qaBaselineDir" f6f742c7ffc099bbd76bde62568ac467b18673f8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir "$qaBaselineDir" install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir "$qaBaselineDir" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "QA_BASELINE_DIR=$qaBaselineDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check diagnostic script syntax
        run: |
          node --check qa/browser/diagnostics/fixtures.mjs
          node --check qa/browser/diagnostics/worker.mjs
          node --check qa/browser/diagnostics/compare.mjs
          node qa/browser/diagnostics/compare.mjs --plan
      - name: Controlled baseline/current performance comparison
        run: node qa/browser/diagnostics/compare.mjs
      - name: Browser acceptance with sandbox enabled
        if: ${{ !cancelled() && steps.qa_types.outcome == 'success' }}
        run: pnpm --dir qa/browser test
      - name: Collect bounded report (maximum 20 MiB)
        if: always()
        run: node qa/browser/collect-artifacts.mjs
      - name: Upload QA evidence for one day
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-acceptance-${{ github.sha }}
          path: qa/browser/artifacts/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
